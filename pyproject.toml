[project]
name = "studycoach"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agno[groq,mistral,google]==2.6.5",
    "alembic==1.16.1",
    "bcrypt==5.0.0",
    "chromadb==1.5.9",
    "fastapi==0.136.1",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "mistralai==1.12.4",
    "fpdf2==2.8.7",
    "numpy==2.4.4",
    "python-multipart==0.0.32",
    "onnxruntime==1.26.0",
    "pypdf==6.11.0",
    "pypdfium2==5.14.0",
    "python-dotenv==1.2.2",
    "rapidocr==3.10.0",
    "sentence-transformers==5.4.1",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx2==2.13.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not real_llm'"
markers = ["real_llm: prove con modello Groq reale, escluse dalla CI normale"]
